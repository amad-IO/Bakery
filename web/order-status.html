<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cek Status Pesanan — KAYA Bakery</title>
  <meta name="description" content="Cek status pesanan pre-order KAYA Bakery dengan kode pesanan Anda." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#e8a33d',
            canvas: '#241610',
            'canvas-alt': '#3a2415',
            success: '#7fbf6a',
            danger: '#e0654f',
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body class="canvas-bg min-h-screen flex items-center justify-center p-4">
  <div class="texture-overlay"></div>

  <!-- Nav -->
  <nav class="fixed top-0 left-0 right-0 z-10 flex items-center justify-between px-6 py-4 backdrop-blur-md" style="background:rgba(36,22,16,0.8)">
    <a href="/" class="font-bold text-xl text-white" style="font-family:'Inter',sans-serif;">
      KA<span style="color:#e8a33d">YA</span>
    </a>
    <a href="/" class="nav-pill text-sm">← Kembali</a>
  </nav>

  <div class="relative z-10 w-full max-w-md pt-16">
    <!-- Glow -->
    <div class="absolute -top-20 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full pointer-events-none"
      style="background:radial-gradient(circle,#e8a33d44 0%,transparent 70%); filter:blur(60px)"></div>

    <!-- Card -->
    <div class="glass-card-lg p-8 relative">
      <div class="text-center mb-8">
        <h1 class="font-bold text-3xl text-white mb-1" style="font-family:'Inter',sans-serif;">
          Status <span style="color:#e8a33d">Pesanan</span>
        </h1>
        <p class="text-white/50 text-sm">Masukkan kode pesanan untuk melihat status</p>
      </div>

      <!-- Search -->
      <div class="space-y-3 mb-6">
        <input id="order-code-input" type="text" placeholder="KYA-20260812-1234"
          class="w-full px-4 py-3 rounded-xl text-white text-sm font-mono placeholder:text-white/30 focus:outline-none focus:ring-2"
          style="background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); focus-ring-color:#e8a33d" />
        <button id="search-btn" class="btn-primary w-full justify-center py-3.5 rounded-xl">
          Cek Status
        </button>
      </div>

      <!-- Result -->
      <div id="result" class="hidden"></div>

      <!-- Error -->
      <div id="error-box" class="hidden rounded-xl p-4 text-sm text-center" style="background:rgba(224,101,79,0.1); border:1px solid rgba(224,101,79,0.3); color:#e0654f">
        Pesanan tidak ditemukan. Pastikan kode benar.
      </div>

      <!-- Loading -->
      <div id="loading" class="hidden text-center py-6">
        <div class="inline-block w-8 h-8 rounded-full border-2 border-t-transparent animate-spin" style="border-color:#e8a33d; border-top-color:transparent"></div>
        <p class="text-white/50 text-sm mt-2">Mencari pesanan...</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8080/api/v1'

    const STATUS_INFO = {
      pending: { label: 'Menunggu', color: '#9ca3af', icon: '⏳', desc: 'Pesanan diterima, menunggu konfirmasi.' },
      pending_payment: { label: 'Menunggu Pembayaran', color: '#fbbf24', icon: '💳', desc: 'Pesanan belum dibayar.' },
      paid: { label: 'Lunas', color: '#7fbf6a', icon: '✅', desc: 'Pembayaran diterima.' },
      preparing: { label: 'Sedang Diproses', color: '#60a5fa', icon: '🧑‍🍳', desc: 'Tim kami sedang menyiapkan pesanan Anda.' },
      ready: { label: 'Siap Diambil', color: '#a78bfa', icon: '🎉', desc: 'Pesanan siap diambil di toko!' },
      completed: { label: 'Selesai', color: '#7fbf6a', icon: '🏅', desc: 'Pesanan telah selesai. Terima kasih!' },
      cancelled: { label: 'Dibatalkan', color: '#e0654f', icon: '❌', desc: 'Pesanan telah dibatalkan.' },
    }

    function formatRp(n) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(n)
    }

    function formatDate(d) {
      return new Date(d).toLocaleString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })
    }

    async function checkStatus() {
      const code = document.getElementById('order-code-input').value.trim().toUpperCase()
      if (!code) return

      document.getElementById('result').classList.add('hidden')
      document.getElementById('error-box').classList.add('hidden')
      document.getElementById('loading').classList.remove('hidden')

      try {
        const res = await fetch(`${API_BASE}/orders/${code}`)
        const json = await res.json()
        if (!json.success) throw new Error('Not found')

        const order = json.data
        const status = STATUS_INFO[order.status] || { label: order.status, color: '#9ca3af', icon: '❓', desc: '' }

        document.getElementById('result').innerHTML = `
          <div class="space-y-4">
            <!-- Status -->
            <div class="text-center rounded-2xl p-6" style="background:rgba(${hexToRgb(status.color)},0.08); border:1px solid rgba(${hexToRgb(status.color)},0.25)">
              <div class="text-5xl mb-2">${status.icon}</div>
              <p class="font-bold text-xl" style="color:${status.color}; font-family:'Inter',sans-serif">${status.label}</p>
              <p class="text-white/50 text-sm mt-1">${status.desc}</p>
            </div>

            <!-- Order info -->
            <div class="rounded-xl p-4 space-y-3" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1)">
              <div class="flex justify-between">
                <span class="text-white/50 text-sm">Kode Pesanan</span>
                <span class="font-mono font-bold text-white text-sm">${order.order_code}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-white/50 text-sm">Nama</span>
                <span class="text-white text-sm">${order.customer_name}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-white/50 text-sm">Tipe</span>
                <span class="text-white text-sm capitalize">${order.order_type === 'pos' ? 'Pembelian Langsung' : 'Pre-order Online'}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-white/50 text-sm">Total</span>
                <span class="font-bold text-sm" style="color:#e8a33d">${formatRp(order.total)}</span>
              </div>
              <div class="flex justify-between">
                <span class="text-white/50 text-sm">Tanggal</span>
                <span class="text-white text-xs text-right">${formatDate(order.created_at)}</span>
              </div>
            </div>

            <!-- Items -->
            ${order.items && order.items.length > 0 ? `
            <div>
              <p class="text-white/40 text-xs uppercase tracking-wide font-semibold mb-2">Item Pesanan</p>
              <div class="space-y-1">
                ${order.items.map(i => `
                  <div class="flex justify-between py-1.5 border-b text-sm" style="border-color:rgba(255,255,255,0.06)">
                    <span class="text-white/70">${i.product_name_snapshot} <span class="opacity-50">×${i.qty}</span></span>
                    <span class="font-semibold text-white">${formatRp(i.subtotal)}</span>
                  </div>`).join('')}
              </div>
            </div>` : ''}
          </div>
        `
        document.getElementById('result').classList.remove('hidden')
      } catch {
        document.getElementById('error-box').classList.remove('hidden')
      } finally {
        document.getElementById('loading').classList.add('hidden')
      }
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1, 3), 16)
      const g = parseInt(hex.slice(3, 5), 16)
      const b = parseInt(hex.slice(5, 7), 16)
      return `${r},${g},${b}`
    }

    document.getElementById('search-btn').addEventListener('click', checkStatus)
    document.getElementById('order-code-input').addEventListener('keypress', e => {
      if (e.key === 'Enter') checkStatus()
    })

    // Pre-fill from query param
    const urlParams = new URLSearchParams(window.location.search)
    const preCode = urlParams.get('code')
    if (preCode) {
      document.getElementById('order-code-input').value = preCode.toUpperCase()
      checkStatus()
    }
  </script>
</body>
</html>

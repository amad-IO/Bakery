# ─────────────────────────────────────────────────────────────────
# CI — Dashboard (React / Vite)
# Triggers on push/PR when files under dashboard/ change
# ─────────────────────────────────────────────────────────────────
name: CI · Dashboard

on:
  push:
    branches: [main, develop]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-dashboard.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "dashboard/**"
      - ".github/workflows/ci-dashboard.yml"

jobs:
  build:
    name: Type-check & Build (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api/v1
        run: npm run build

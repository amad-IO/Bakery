version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: kaya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kayasecret}
      POSTGRES_DB: ${POSTGRES_DB:-kaya_bakery}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kaya}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kaya_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-kaya}:${POSTGRES_PASSWORD:-kayasecret}@postgres:5432/${POSTGRES_DB:-kaya_bakery}?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    working_dir: /app

volumes:
  postgres-data:
